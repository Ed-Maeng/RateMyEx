--- 
  - name: Update Backend 
    hosts: backend
    user: ubuntu

    tasks:
    - name: Pull Newest Update from Github
      git:
        repo: git@github.com:Ed-Maeng/Review.git
        dest: /home/ubuntu/Review
        update: yes
        clone: no
        force: yes
        version: main
        key_file: "/home/ubuntu/.ssh/id_ed25519"
    
    - name: Restart PM2
      shell: |
        pm2 restart Backend
      args:
        chdir: "/home/ubuntu/Review/server"
      
    - name: Validate whether PM2 has restarted or not
      shell: |
        pm2 list
      args:
        chdir: "/home/ubuntu/Review/server"
      register: result
    
    - name: Validate whether PM2 has restarted or not
      debug:
        msg: "PM2 has restarted"
      when: result.stdout.find("Backend") != -1