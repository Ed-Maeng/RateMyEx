--- 
  - name: Update Frontend 
    hosts: frontend
    user: ubuntu

    tasks:
    - include_vars: vars.yml

    - name: Delete current Website content
      become: true
      file:
        path: /var/www/ratemyexschool.com/html
        state: absent
    
    - name: Create Website content directory
      become: true
      file:
        path: /var/www/ratemyexschool.com/html
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: 0777
    
    - name: Paste Updated file to Server
      become: true
      copy:
        src: "/home/{{build_location}}/Review/client/build/"
        dest: /var/www/ratemyexschool.com/html
        owner: ubuntu
        group: ubuntu
        mode: 0777

    - name: Get Return Code of Website
      local_action: uri
      args:
        url: https://ratemyexschool.com
        return_content: yes
      register: result
    
    - name: Validate whether Return code is 200
      debug:
        msg: "Website is up and running"
      when: result.status == 200 or return.status == 201
